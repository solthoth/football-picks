# .github/workflows/deploy-app-prod.yaml
name: Deploy App (prod)

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-app-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Public blob container the site reads live scores from.
          VITE_SCORES_BASE_URL: https://solthothfbpicksprod.blob.core.windows.net/scores

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/
          skip_app_build: true
