# .github/workflows/deploy-app-dev.yaml
name: Deploy App (dev)

on:
  push:
    branches: [main]
  # Manual runs let a feature branch deploy to dev for a real-URL check
  # before cutting a release to prod.
  workflow_dispatch:

concurrency:
  group: deploy-app-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Public blob container the site reads live scores from.
          VITE_SCORES_BASE_URL: https://solthothfbpicksdev.blob.core.windows.net/scores

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/
          skip_app_build: true
